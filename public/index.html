<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container text-center mt-5">
    <h1 class="mb-4">QR Code Generator</h1>
    <form action="/generate" method="POST" class="mb-3">
      <input type="text" name="text" placeholder="Enter text or URL" class="form-control mb-3" required>
      <button type="submit" class="btn btn-primary btn-lg">Generate QR Code</button>
    </form>
  </div>
</body>
</html>
